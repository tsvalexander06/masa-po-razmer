name: Deploy the Econt function to Supabase

# Puts supabase/functions/econt into the Supabase project (no manual copy-paste in the dashboard).
# Needs one GitHub secret: SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens).
# The Econt login is NOT here: it stays in Supabase → Edge Functions → Secrets (ECONT_USER, ECONT_PASS).
# JWT check at the gateway is off because the function itself only answers logged-in admins.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node (for the Supabase CLI from npm)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy econt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Add the SUPABASE_ACCESS_TOKEN secret in GitHub (Settings → Secrets and variables → Actions) and run this again."
            exit 0
          fi
          REF="$(grep -oE 'https://[a-z0-9-]+\.supabase\.co' site/admin/cloud-config.js | head -1 | sed -E 's#https://([a-z0-9-]+)\.supabase\.co#\1#')"
          echo "Project: $REF"
          # the CLI from npm (looking up the newest GitHub release can hit GitHub's rate limit)
          npx --yes supabase@latest --version
          npx --yes supabase@latest functions deploy econt --project-ref "$REF" --no-verify-jwt --use-api
          npx --yes supabase@latest functions list --project-ref "$REF"
