name: Deploy to GitHub Pages

# Publishes the site/ folder as the site root, so the app is served at
# https://<owner>.github.io/<repo>/

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (auto-enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Cache-bust JS so updates show without a hard refresh
        run: |
          V="${GITHUB_SHA::8}"
          sed -i "s#src=\"app.js\"#src=\"app.js?v=$V\"#; s#vendor/jspdf-2.5.1.umd.min.js#vendor/jspdf-2.5.1.umd.min.js?v=$V#" site/index.html
          sed -i "s#src=\"admin.js\"#src=\"admin.js?v=$V\"#; s#src=\"gate.js\"#src=\"gate.js?v=$V\"#" site/admin/index.html
          sed -i "s#src=\"cloud.js\"#src=\"cloud.js?v=$V\"#; s#src=\"cloud-config.js\"#src=\"cloud-config.js?v=$V\"#" site/admin/index.html
          # the admin may talk to its Supabase project (address from cloud-config.js)
          U="$(grep -oE 'https://[a-z0-9-]+\.supabase\.co' site/admin/cloud-config.js | head -1 || true)"
          if [ -n "$U" ]; then sed -i "s#connect-src 'self'#connect-src 'self' $U#" site/admin/index.html; echo "CSP allows $U"; fi
          D="$(date -u +%Y-%m-%d\ %H:%M)"
          find site -name '*.html' -print0 | xargs -0 sed -i "s/__BUILD__/$V · $D UTC/g"
          echo "Versioned assets and build stamp with v=$V"

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      # GitHub sometimes lists the just-uploaded artifact only after a few seconds
      # ("No artifacts named github-pages were found") — wait, and try once more if needed.
      - name: Wait for the artifact to be listed
        run: sleep 15

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying the deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
