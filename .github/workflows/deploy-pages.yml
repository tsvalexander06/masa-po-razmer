name: Deploy to GitHub Pages

# Publishes the site/ folder as the site root, so the app is served at
# https://<owner>.github.io/<repo>/

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (auto-enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Cache-bust JS so updates show without a hard refresh
        run: |
          V="${GITHUB_SHA::8}"
          sed -i "s#src=\"app.js\"#src=\"app.js?v=$V\"#; s#vendor/jspdf-2.5.1.umd.min.js#vendor/jspdf-2.5.1.umd.min.js?v=$V#" site/index.html
          sed -i "s#src=\"admin.js\"#src=\"admin.js?v=$V\"#" site/admin/index.html
          echo "Versioned assets with v=$V"

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
