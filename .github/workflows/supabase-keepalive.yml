name: Keep the Supabase project awake

# A free Supabase project is paused after 7 days without any request.
# This sends one small read every 2 days so the admin's cloud never sleeps.
# Uses only the public URL and key from site/admin/cloud-config.js (no secrets);
# the database answers with nothing because the request is not logged in.

on:
  schedule:
    - cron: "23 3 */2 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping Supabase
        run: |
          U="$(grep -oE 'https://[a-z0-9-]+\.supabase\.co' site/admin/cloud-config.js | head -1 || true)"
          K="$(grep -oE 'key: *"[^"]+"' site/admin/cloud-config.js | sed -E 's/key: *"([^"]+)"/\1/' | head -1 || true)"
          if [ -z "$U" ] || [ -z "$K" ]; then echo "Cloud not configured yet — nothing to do."; exit 0; fi
          code="$(curl -s -o /dev/null -w '%{http_code}' "$U/rest/v1/kv?select=id&limit=1" -H "apikey: $K")"
          echo "Supabase answered HTTP $code"
          if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then exit 1; fi

      - name: Check the setup (read-only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          U="$(grep -oE 'https://[a-z0-9-]+\.supabase\.co' site/admin/cloud-config.js | head -1 || true)"
          K="$(grep -oE 'key: *"[^"]+"' site/admin/cloud-config.js | sed -E 's/key: *"([^"]+)"/\1/' | head -1 || true)"
          [ -z "$U" ] && exit 0
          get(){ printf '%-34s ' "$1"; curl -s -m 20 -w '  [HTTP %{http_code}]\n' "$U/$1" -H "apikey: $K" | head -c 300; }
          echo "Without login every table must answer [] (exists, nothing visible):"
          for t in kv orders offcuts; do get "rest/v1/$t?select=id&limit=1"; done
          get "rest/v1/counters?select=name"
          printf '%-34s ' "rpc/is_admin (no login)"; curl -s -m 20 -w '  [HTTP %{http_code}]\n' -X POST "$U/rest/v1/rpc/is_admin" -H "apikey: $K" -H "Content-Type: application/json" -d '{}'
          printf '%-34s ' "rpc/take_serial (no login)"; curl -s -m 20 -w '  [HTTP %{http_code}]\n' -X POST "$U/rest/v1/rpc/take_serial" -H "apikey: $K" -H "Content-Type: application/json" -d '{"p_name":"probe","p_count":0,"p_min":1}' | head -c 300
          printf '%-34s ' "auth settings"; curl -s -m 20 "$U/auth/v1/settings" -H "apikey: $K" | python3 -c "import sys,json; d=json.load(sys.stdin); print('disable_signup =', d.get('disable_signup'), '| email login =', d.get('external',{}).get('email'))"
