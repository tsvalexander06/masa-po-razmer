<html lang="bg">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Маси по размер — konvektomat.store</title>
<style>
  :root{
    --brand:#1E6FF4; --brand-dark:#1552c7; --ink:#15223a; --muted:#64748b;
    --line:#d5dde7; --bg:#eef3f9; --card:#ffffff; --accent:#16a34a; --wa:#25D366;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:linear-gradient(180deg,#cfe0f8 0%,#e4edfa 260px,#eef3f9 100%);color:var(--ink);line-height:1.45}
  header{background:linear-gradient(180deg,#e7f1ff,#ffffff);border-bottom:3px solid var(--brand);padding:16px 20px}
  header img{height:34px;display:block}
  header p{margin:8px 0 0;font-size:13px;color:var(--muted)}
  .wrap{max-width:820px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid #cfdcf0;border-top:3px solid var(--brand);border-radius:14px;padding:16px;
    box-shadow:0 2px 10px rgba(30,111,244,.08);margin-bottom:16px}
  .card h2{margin:0 0 12px;font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--brand);
    display:flex;align-items:center;gap:8px;padding-bottom:9px;border-bottom:2px solid #e1ebfb}
  .card h2::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--brand);display:inline-block;flex:0 0 auto}
  .tableCard h3{margin:14px 0 10px;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .rm{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca;border-radius:8px;
    padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer}
  .rm:active{transform:translateY(1px)}
  .addBtn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
    padding:15px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;
    background:#fff;color:var(--brand);border:2px dashed var(--brand);margin-bottom:16px}
  .addBtn:active{transform:translateY(1px)}
  .bp{width:100%;height:auto;background:#eef5ff;border:1px solid #c7d8f2;border-radius:10px;display:block}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px;color:var(--ink)}
  .hint{font-weight:400;color:var(--muted);font-size:12px}
  .info{margin:6px 0 0;font-size:13px;color:var(--ink);background:#eef5ff;border:1px solid #c7d8f2;border-radius:8px;padding:8px 10px}
  input[type=number],input[type=text],textarea,select{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-size:16px;
    background:#fff;color:var(--ink)}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .toggle{display:flex;align-items:center;gap:9px;margin:12px 0;font-size:15px;font-weight:600;cursor:pointer}
  .toggle input{width:20px;height:20px;accent-color:var(--brand);flex:0 0 auto}
  .sub{margin-left:29px;margin-top:-4px}
  textarea{min-height:64px;resize:vertical;font-family:inherit}
  .spec{background:#0f2744;color:#e2e8f0;border-radius:10px;padding:14px;font-size:13px;
    white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;line-height:1.6}
  .btns{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:11px;
    font-size:16px;font-weight:700;border:none;cursor:pointer;text-decoration:none;color:#fff}
  .btn-wa{background:var(--brand)} .btn-pdf{background:var(--brand)} .btn-calc{background:var(--brand)}
  .btn-new{background:#fff;color:var(--brand);border:2px solid var(--brand)}
  .btn:active{transform:translateY(1px)}
  .price{margin-top:12px;background:#eef5ff;border:1px solid #c7d8f2;border-radius:12px;padding:14px;text-align:center}
  .price .plabel{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .price .pbig{font-size:30px;font-weight:800;color:var(--brand-dark);margin-top:4px}
  .price .plines{margin-top:10px;font-size:13px;text-align:left;display:flex;flex-direction:column;gap:4px}
  .price .plines>div{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #dbe6f5;padding-top:4px}
  .price .pnote,.price .pmsg{font-size:12px;color:var(--muted);margin-top:8px}
  .ok{color:var(--accent);font-size:13px;font-weight:600;text-align:center;min-height:18px;margin-top:4px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
  footer b{color:var(--brand)}
</style>
</head>
